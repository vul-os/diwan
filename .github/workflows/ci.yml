# no-broker-dep:allow-file: the P2P E2E job further down names Pier/vulos-relayd describing
# the DEFAULT built-in surface's independence from any relay ("no Vulos OS, no Pier, no relay
# and no account") and a historical note about a since-removed sibling-repo clone step — no
# workflow step here fetches, builds against, or depends on anything named pier.
#
# .github/workflows/ci.yml — build, test, and vet diwan (Go + frontend)
#
# Triggers on:
#   - push to any branch
#   - pull request
#
# Jobs:
#   go-ci      — build, test (short), vet the Go backend
#   frontend   — npm ci, build, test the frontend

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Restrict default permissions to read-only; no job needs write access.
permissions:
  contents: read

jobs:

  # ── Go backend ──────────────────────────────────────────────────────────────
  go-ci:
    name: Go build / test / vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (short)
        run: go test -short ./...

      - name: Vet
        run: go vet ./...

  # ── Go backend — Postgres integration ───────────────────────────────────────
  # Runs the full Go test suite with VULOS_TEST_POSTGRES_DSN set so the
  # dual-backend contract tests (backend_contract_test.go,
  # fileacl_postgres_test.go) exercise a real Postgres instance in the
  # "office" schema. Depends on the base go-ci job succeeding first.
  go-postgres:
    name: Go test (Postgres — schema office)
    runs-on: ubuntu-latest
    needs: go-ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vulos
          POSTGRES_PASSWORD: vulos
          POSTGRES_DB: vulos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with Postgres backend
        env:
          VULOS_TEST_POSTGRES_DSN: "postgres://vulos:vulos@localhost:5432/vulos_test?sslmode=disable"
        run: go test ./backend/storage/... -v -count=1

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Frontend E2E (Playwright) ───────────────────────────────────────────────
  # Browser-level end-to-end tests against a production `vite preview` build,
  # with the /v1 + doc APIs mocked in-browser (see e2e/fixtures.js). No Go
  # backend required — the suite is hermetic.
  e2e:
    name: Frontend E2E (Playwright / chromium)
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Real P2P integration E2E (one bare binary, two browsers) ────────────────
  # The opposite of the job above: nothing is mocked. It builds the real `diwan`
  # binary, runs it with its OWN built-in peer-discovery surface
  # (backend/rendezvous — the default), and proves that two real browsers
  # collaborate peer-to-peer through it over a real WebRTC data channel, with no
  # Vulos OS, no Pier, no relay and no account. That is the repo's central
  # architectural claim, and this is the job that holds it.
  #
  # NOTHING IS FETCHED AT TEST TIME. This job used to `git clone` a sibling relay
  # repository so the suite could build a `vulos-relayd` to signal through. Two
  # things were wrong with that: the claim under test became conditional on
  # another product, and the clone targeted a repo that was later renamed — so the
  # job failed for a reason unrelated to this code while the claim it was meant to
  # guard went unchecked. Everything this job needs now comes from this repository.
  #
  # Deliberately a SEPARATE job so its heavier, WebRTC-dependent runtime can never
  # destabilise the fast suites.
  e2e-p2p:
    name: Real P2P E2E (built-in rendezvous, no external deps)
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # The default-path suite. VULOS_RELAYD_BIN is deliberately NOT set, so the
      # external-relay suite skips (with its reason printed) while this one runs —
      # it has no external dependency and therefore cannot be skipped.
      - name: Run real P2P E2E (built-in discovery surface)
        run: npm run test:e2e:p2p
        env:
          CI: 'true'

      # Fail closed on a vanished suite. `playwright test` exits 0 when every test
      # skipped, so a regression that made the built-in suite skip itself — a
      # renamed file, a beforeAll that bails, a testMatch that stops matching —
      # would look exactly like success. Assert instead that the default-path
      # tests actually EXECUTED, by name.
      - name: Assert the default-path suite really ran
        run: |
          set -euo pipefail
          npx playwright test --config playwright.p2p.config.js --list --reporter=list \
            > "$RUNNER_TEMP/p2p-list.txt" 2>&1 || true
          echo "── collected tests ──"
          cat "$RUNNER_TEMP/p2p-list.txt"
          grep -q 'builtin-rendezvous-p2p' "$RUNNER_TEMP/p2p-list.txt" \
            || { echo "FAIL: the built-in-rendezvous P2P suite was not collected at all"; exit 1; }
          grep -q 'THE PAYOFF' "$RUNNER_TEMP/p2p-list.txt" \
            || { echo "FAIL: the payoff test is missing from the collected suite"; exit 1; }

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-p2p
          path: playwright-report/
          retention-days: 7
